name: Reusable Actions pin check

# Reusable workflow (workflow_call): fails when a workflow or action of the calling repository
# uses a third-party action, reusable workflow or container image by a movable tag instead of
# a full commit SHA or image digest (hive-check-action-pins at `devtools-ref`).
#
#   jobs:
#     action-pins:
#       uses: ChefTaco/HiveCommon/.github/workflows/reusable-action-pins.yml@<sha> # hive-devtools-vX.Y.Z
#       with:
#         devtools-ref: <the same sha>
#
# See tooling/README.md.

on:
  workflow_call:
    inputs:
      devtools-ref:
        description: Full commit SHA of ChefTaco/HiveCommon whose tooling/ runs; use the SHA of the uses line
        type: string
        required: true
      require-version-comment:
        description: Also require a version comment (# v4.2.1) after every pinned SHA
        type: boolean
        default: true
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  action-pins:
    name: Actions pinned by SHA
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check devtools-ref
        env:
          DEVTOOLS_REF: ${{ inputs.devtools-ref }}
        run: |
          [[ "$DEVTOOLS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::devtools-ref must be a full 40-character commit SHA'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChefTaco/HiveCommon
          ref: ${{ inputs.devtools-ref }}
          path: devtools
          sparse-checkout: tooling
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Check pins
        working-directory: source
        env:
          REQUIRE_VERSION_COMMENT: ${{ inputs.require-version-comment }}
        run: |
          args=()
          if [[ "$REQUIRE_VERSION_COMMENT" == true ]]; then args+=(--require-version-comment); fi
          node ../devtools/tooling/bin/check-action-pins.mjs "${args[@]}"
